<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>額度監控器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="drag">
    <h1>額度監控器</h1>
    <div class="actions no-drag">
      <button id="btn-compact" title="極簡模式（縮成一行）">▁</button>
      <button id="btn-refresh" title="重新讀取額度">⟳</button>
      <button id="btn-settings" title="設定">⚙</button>
      <button id="btn-hide" title="收到系統匣">✕</button>
    </div>
  </header>

  <div id="view-compact">
    <div class="compact-line drag" id="compact-line"></div>
    <div class="actions no-drag">
      <button id="btn-update2" class="upd" hidden>⬆ 更新</button>
      <button id="btn-expand" title="展開">▢</button>
      <button id="btn-hide2" title="收到系統匣">✕</button>
    </div>
  </div>

  <div id="update-bar" hidden><span id="update-text"></span><button id="btn-update">重新啟動並更新</button></div>

  <main id="view-main">
    <section class="card" id="card-claude" data-provider="claude">
      <div class="card-head"><span class="dot claude"></span><h2>Claude Code</h2><span class="plan"></span></div>
      <div class="windows"></div>
      <p class="meta"></p>
      <div class="row login-row" hidden><button id="btn-claude-login">登入 claude.ai 讀取額度</button></div>
      <p class="meta logout-row" hidden>透過小工具裡登入的 claude.ai 讀取 · <a href="#" id="btn-claude-logout">登出</a></p>
    </section>
    <section class="card" id="card-codex" data-provider="codex">
      <div class="card-head"><span class="dot codex"></span><h2>Codex</h2><span class="plan"></span></div>
      <div class="windows"></div>
      <p class="meta"></p>
    </section>

    <section class="news">
      <div class="news-head">
        <h2>Reset 與公告</h2>
        <div class="tabs" role="tablist">
          <button data-filter="reset" class="active">只看 reset</button>
          <button data-filter="all">全部</button>
          <button data-filter="claude">Claude</button>
          <button data-filter="codex">Codex</button>
        </div>
      </div>
      <ul id="news-list"></ul>
      <p class="meta" id="news-meta"></p>
    </section>
  </main>

  <main id="view-settings" hidden>
    <h2>設定</h2>
    <label>額度更新間隔（分鐘）<input type="number" id="s-usage" min="2"></label>
    <label>公告更新間隔（分鐘）<input type="number" id="s-news" min="5"></label>
    <label id="s-glass-row">背景
      <select id="s-glass"><option value="clear">完全透明（直接看到桌面）</option><option value="blur">毛玻璃模糊</option></select>
    </label>
    <label>文字顏色
      <select id="s-theme"><option value="auto">自動（依背後桌面深淺）</option><option value="system">跟隨 Windows 深淺色</option><option value="light">固定深色文字</option><option value="dark">固定白色文字</option></select>
    </label>
    <p class="hint">「自動」會每幾秒看一下小工具背後的亮度：背後亮就用深色字，暗就用白色字。只在這台電腦上算出一個亮度值，不會存下畫面或傳出去。</p>
    <label>平常的底色濃度 <span id="s-rest-v"></span>（0% 完全透明）
      <input type="range" id="s-rest" min="0" max="60" step="5">
    </label>
    <label class="check"><input type="checkbox" id="s-hover"> 滑鼠移上去時變不透明</label>
    <label>剩餘低於幾 % 時通知（0 表示不通知）<input type="number" id="s-low" min="0" max="50"></label>
    <label class="check"><input type="checkbox" id="s-top"> 視窗保持在最上層</label>
    <label class="check"><input type="checkbox" id="s-login"> 開機時自動啟動</label>
    <label class="check"><input type="checkbox" id="s-notify"> 有新的 reset 公告或額度被 reset 時跳通知</label>
    <label>X API Bearer Token（選填）
      <input type="password" id="s-xtoken" placeholder="留空則不讀官方 X 帳號">
    </label>
    <p class="hint">X 官方 API 要付費才能讀貼文。填了之後會讀 @thsottiaux、@OpenAIDevs、@claudeai、@AnthropicAI 裡提到 reset 或額度的貼文。Token 用系統加密存在這台電腦上。沒填的話，tibo 的 reset 貼文仍會從 tokenusage.dev 取得。</p>
    <div class="row ver"><span class="hint" id="s-version"></span><span class="spacer"></span><button id="s-check" class="secondary">檢查新版本</button></div>
    <div class="row">
      <button id="s-clear-x" class="secondary">清除 X Token</button>
      <span class="spacer"></span>
      <button id="s-cancel" class="secondary">取消</button>
      <button id="s-save">儲存</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
