name: Release

# main 上的 package.json 版本號變了，就在 Windows 上打包並發布到 GitHub Releases；
# 已安裝的小工具會讀 bundle.json，只下載新的程式內容（.asar）來更新。同一個版本已發布過就跳過。
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查這個版本是否已發布
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          # 安裝檔和 bundle.json 都已經在 Release 裡才算發布過；只有半套的 Release 會重新上傳
          ASSETS=$(gh release view "v$VER" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -q '^QuotaMonitor-Setup-.*\.exe$' && echo "$ASSETS" | grep -qx 'bundle.json'; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip == 'false'
        run: npm ci
      - if: steps.check.outputs.skip == 'false'
        run: npm test
      # 先建立草稿 Release，再讓 electron-builder 上傳到這個草稿，最後才公開；
      # 避免同時上傳多個檔案時各自建出重複的 Release
      - name: 建立草稿 Release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --draft --title "v$VER" --notes "額度監控器 $VER" --target "$GITHUB_SHA"
      - if: steps.check.outputs.skip == 'false'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 上傳程式內容更新檔
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          node scripts/make-bundle.js
          gh release upload "v$VER" "dist/quota-monitor-$VER.asar" dist/bundle.json --clobber
      - name: 公開 Release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release view "v$VER" --json assets -q '.assets[].name'
          gh release edit "v$VER" --draft=false --latest
